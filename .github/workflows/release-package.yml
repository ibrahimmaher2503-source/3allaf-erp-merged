name: Release Package (public/build + focused checks)
# Every push builds the frontend bundle off the production server for exactly that commit,
# publishes it with its SHA-256, and runs focused checks against a disposable MariaDB.
# The artifact is named after the commit, so the server deploys the same commit the bundle came from.
# Independent of the fast QA gate.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
    inputs:
      compare_with:
        description: 'Optional: a commit to compare application files against (reported only, never fails the run)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  release-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit being packaged
        id: commit
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:8}" >> "$GITHUB_OUTPUT"
          git log -1 --format='Packaging %H%n%s'
      - name: Application files changed since the given commit (informational)
        if: ${{ github.event.inputs.compare_with != '' }}
        env:
          COMPARE_WITH: ${{ github.event.inputs.compare_with }}
        run: git diff --name-only "$COMPARE_WITH" HEAD -- . ':(exclude).github' ':(exclude)tests' ':(exclude).ai' || true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, mysqli, pdo_mysql, zip
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y mariadb-server mariadb-client
      - run: composer install --no-interaction --prefer-dist --no-scripts
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Package public/build with SHA-256
        env:
          SHORT: ${{ steps.commit.outputs.short }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          mkdir -p dist
          name="public-build-$SHORT"
          (cd public && zip -qrX "../dist/$name.zip" build)
          (cd dist && sha256sum "$name.zip" | tee "$name.zip.sha256")
          { echo "commit=$SHA"; echo "built_at=$(date -u +%FT%TZ)"; echo "entry_js=$(grep -o 'assets/app-[^"]*\.js' public/build/manifest.json | head -1)"; echo "entry_css=$(grep -o 'assets/app-[^"]*\.css' public/build/manifest.json | head -1)"; } | tee "dist/$name.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: public-build-${{ steps.commit.outputs.short }}
          path: dist/
          if-no-files-found: error
      - name: Focused check — opening stock fills only empty product costs (disposable MariaDB)
        run: ./scripts/qa/mariadb-run.sh focused tests/Feature/OpeningInventoryCostFillTest.php
